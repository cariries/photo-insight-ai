[project]
name = "photo-insight"
version = "0.1.0"
description = "Batch-classify photos into your own categories and add popular photography hashtags, offline with a local LLM."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "pillow>=10",
  "pillow-heif>=0.18",
  "pyyaml>=6",
  "opencc>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
photo-insight = "photo_insight.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["photo_insight"]

[tool.setuptools.package-data]
photo_insight = ["static/*", "data/*"]
